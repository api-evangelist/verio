name: Verio
description: 'Verio was a global web hosting provider and internet service provider that pioneered the ISP
  "rollup" model, acquiring more than 200 smaller ISPs and hosting companies after its 1996 founding in
  Denver, Colorado. It went public on NASDAQ (ticker VRIO) in 1999 and was acquired by NTT Communications
  in 2000 for roughly $5 billion. In 2015 its SMB shared-hosting division was sold to Endurance International
  Group, and the Verio brand is now operated within Newfold Digital, redirecting to Network Solutions /
  iPage. The company exposes no public developer or API surface; the verio.com apex no longer resolves and
  www.verio.com redirects to Network Solutions. This profile is retained as a legacy/defunct company record.'
